<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Enciclopedia SAXS</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f7f7f8; --line: #e6e6e9; --text: #1b1b1f; --muted: #6b6b75;
    --accent: #1f4fd1; --accent-soft: #eaf0ff;
    --ok: #1e7f4f; --ok-bg: #e7f6ee; --buy: #b42318; --buy-bg: #fdecea;
    --less: #9a5b00; --less-bg: #fff4e0; --over: #5b3fb8; --over-bg: #f0ebff; --none: #6b6b75; --none-bg: #f0f0f2;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; gap: 16px; align-items: center; flex-wrap: wrap; }
  header h1 { margin: 0; font-size: 18px; letter-spacing: .02em; white-space: nowrap; }
  header h1 span { color: var(--muted); font-weight: 400; }
  #q { flex: 1 1 260px; min-width: 0; padding: 9px 12px; border: 1px solid var(--line); border-radius: 8px; font: inherit; }
  #q:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .stats { display: flex; gap: 18px; color: var(--muted); font-size: 13px; flex-wrap: wrap; }
  .stats b { color: var(--text); font-variant-numeric: tabular-nums; }
  .btn { border: 1px solid var(--line); background: var(--bg); padding: 7px 11px; border-radius: 8px; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
  .btn:hover { background: var(--panel); }
  .btn.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
  .layout { display: grid; grid-template-columns: 250px 1fr; }
  aside { border-right: 1px solid var(--line); padding: 16px; position: sticky; top: var(--hh, 100px); height: calc(100vh - var(--hh, 100px)); overflow: auto; }
  aside h3 { font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 18px 0 6px; }
  aside h3:first-child { margin-top: 0; }
  .f { display: flex; justify-content: space-between; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 6px; font: inherit; font-size: 13px; cursor: pointer; color: var(--text); }
  .f:hover { background: var(--panel); }
  .f.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .f small { color: var(--muted); font-variant-numeric: tabular-nums; }
  label.chk { display: flex; gap: 8px; align-items: center; font-size: 13px; padding: 4px 8px; cursor: pointer; }
  label.chk.sep, #disp.sep { margin-top: 6px; padding-top: 8px; border-top: 1px solid var(--line); }
  /* Graduar stock */
  #grad .gr-fila { display: flex; gap: 6px; align-items: end; margin-bottom: 6px; padding: 0 2px; }
  #grad .gr-fila label { display: flex; flex-direction: column; gap: 2px; font-size: 11px; color: var(--muted); flex: 1; min-width: 0; }
  #grad input { width: 100%; padding: 5px 7px; border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; background: var(--bg); color: var(--text); }
  #grad input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  #grad .gr-fila > span { font-size: 12px; color: var(--muted); padding-bottom: 7px; }
  #grad .chip { font-size: 11.5px; padding: 3px 8px; }
  /* Árbol de categorías / subcategorías */
  .ct { display: grid; grid-template-columns: 1fr auto; align-items: center; }
  .ct > label, .cs label { display: flex; gap: 7px; align-items: center; font-size: 13px; padding: 4px 6px; border-radius: 6px; cursor: pointer; min-width: 0; }
  .ct > label:hover, .cs label:hover { background: var(--panel); }
  .ct > label span, .cs label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ct > label small, .cs label small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .ct > label.on span { color: var(--accent); font-weight: 600; }
  .ct .abre { border: 0; background: none; color: var(--muted); cursor: pointer; padding: 2px 6px; border-radius: 4px; font-size: 12px; }
  .ct .abre:hover { background: var(--panel); color: var(--text); }
  .cs { grid-column: 1 / -1; margin: 0 0 4px 14px; padding-left: 8px; border-left: 2px solid var(--line); }
  .cs label { font-size: 12.5px; padding: 3px 6px; }
  .cs .todo { font-size: 11px; color: var(--muted); padding: 2px 6px; }
  .cero { opacity: .45; }
  .body .pr { font-size: 12px; color: var(--text); font-variant-numeric: tabular-nums; }
  .tbl th.ord { cursor: pointer; user-select: none; }
  .tbl th.ord:hover { color: var(--text); background: var(--line); }
  .tbl th.ord.on { color: var(--accent); }
  .tbl .mini-img { width: 34px; height: 34px; border-radius: 5px; object-fit: cover; background: var(--panel); display: block; }
  select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; font: inherit; font-size: 13px; background: var(--bg); }
  main { padding: 16px 20px 60px; min-width: 0; }
  .sec h2 { font-size: 15px; margin: 22px 0 10px; display: flex; gap: 10px; align-items: baseline; }
  .sec h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .sec:first-child h2 { margin-top: 4px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(172px, 1fr)); gap: 12px; }
  .card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: pointer; background: var(--bg); transition: box-shadow .15s, border-color .15s; display: flex; flex-direction: column; }
  .card:hover { border-color: #c9c9d0; box-shadow: 0 4px 14px rgba(0,0,0,.07); }
  .ph { aspect-ratio: 1; background: var(--panel); position: relative; }
  .ph img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .ph .noimg { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; color: var(--muted); font-size: 12px; padding: 10px; }
  .ph .noimg b { display: block; font-size: 22px; color: #b9b9c2; letter-spacing: .05em; }
  .ph .tag { position: absolute; left: 6px; bottom: 6px; background: rgba(255,255,255,.92); border: 1px solid var(--line); font-size: 10px; padding: 1px 6px; border-radius: 4px; color: var(--muted); }
  .ph .sig { position: absolute; right: 6px; top: 6px; }
  .body { padding: 8px 10px 10px; display: flex; flex-direction: column; gap: 2px; flex: 1; }
  .body .a { font-weight: 650; font-size: 13px; }
  .body .c { font-size: 13px; color: var(--text); }
  .body .s { font-size: 11px; color: var(--muted); font-family: ui-monospace, Consolas, monospace; }
  .body .st { margin-top: auto; padding-top: 6px; display: flex; justify-content: space-between; align-items: baseline; font-size: 12px; color: var(--muted); }
  .body .st b { font-size: 15px; color: var(--text); font-variant-numeric: tabular-nums; }
  .body .st b.zero { color: var(--buy); }
  .pill { display: inline-block; font-size: 10px; font-weight: 700; padding: 2px 7px; border-radius: 99px; letter-spacing: .03em; white-space: nowrap; }
  .p-COMPRAR { color: var(--buy); background: var(--buy-bg); }
  .p-OK { color: var(--ok); background: var(--ok-bg); }
  .p-PEDIR { color: var(--less); background: var(--less-bg); }
  .p-SOBRESTOCK { color: var(--over); background: var(--over-bg); }
  .p-SIN { color: var(--none); background: var(--none-bg); }
  .edited { color: var(--accent); font-size: 11px; }
  .empty { color: var(--muted); padding: 40px 0; text-align: center; }
  .body .ve { font-size: 10.5px; color: var(--muted); line-height: 1.35; margin-top: 4px; }
  .body .ve span { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .p-SALDO { color: #8a4b00; background: #ffe9c7; }
  .ph .saldo { position: absolute; left: 34px; top: 6px; }
  /* Selección de productos */
  .ph .selbox { position: absolute; left: 6px; top: 6px; z-index: 2; width: 24px; height: 24px; display: grid; place-items: center; background: rgba(255,255,255,.94); border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  .ph .selbox input, .selcol input { margin: 0; width: 15px; height: 15px; cursor: pointer; accent-color: var(--accent); }
  .card.elegida { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .tbl tr.elegida td { background: var(--accent-soft); }
  .tbl .selcol { width: 28px; text-align: center; }
  /* Encabezado: el buscador y los totales ceden lugar para que "Selección" quede arriba a la derecha */
  header #q { flex: 1 1 200px; }
  header .stats { flex: 1 1 260px; min-width: 0; gap: 4px 14px; }
  .sel-btn { margin-left: auto; }
  .sel-btn b { display: inline-block; min-width: 18px; padding: 0 5px; margin-left: 4px; border-radius: 99px; background: var(--panel); font-variant-numeric: tabular-nums; }
  .sel-btn.con b { background: var(--accent); color: #fff; }
  #selp { position: fixed; top: 0; right: 0; bottom: 0; width: min(820px, 100vw); background: var(--bg); z-index: 12; overflow: auto; box-shadow: -10px 0 30px rgba(0,0,0,.14); transform: translateX(100%); transition: transform .2s; }
  #selp.open { transform: none; }
  #selp .sh { position: sticky; top: 0; z-index: 1; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 18px; display: flex; flex-wrap: wrap; gap: 10px; align-items: end; justify-content: space-between; }
  #selp .sh h2 { margin: 0; font-size: 17px; flex-basis: 100%; display: flex; justify-content: space-between; align-items: center; }
  #selp .sh h2 small { color: var(--muted); font-weight: 400; font-size: 13px; }
  #selp .sb { padding: 14px 18px 40px; }
  #selp .acciones { display: flex; gap: 8px; flex-wrap: wrap; }
  .sl-row { display: grid; grid-template-columns: 22px 44px 1fr auto auto 28px; gap: 10px; align-items: center; padding: 7px 4px; border-bottom: 1px solid var(--line); font-size: 13px; }
  .sl-row .n { color: var(--muted); font-size: 11px; text-align: right; font-variant-numeric: tabular-nums; }
  .sl-row img, .sl-row .mini-img { width: 44px; height: 44px; border-radius: 6px; object-fit: cover; background: var(--panel); display: block; }
  .sl-row .t { min-width: 0; cursor: pointer; }
  .sl-row .t small { display: block; color: var(--muted); font-size: 11.5px; }
  .sl-row .v { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .sl-row .v small { display: block; color: var(--muted); font-size: 11px; }
  .quita { border: 0; background: none; cursor: pointer; color: var(--muted); font-size: 16px; line-height: 1; padding: 4px; border-radius: 4px; }
  .quita:hover { color: var(--buy); background: var(--buy-bg); }
  .sl-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 10px; }
  .sl-card { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; position: relative; font-size: 12.5px; }
  .sl-card .ph { aspect-ratio: 1; cursor: pointer; }
  .sl-card .bd { padding: 6px 8px 8px; }
  .sl-card .bd small { color: var(--muted); display: block; }
  .sl-card .quita { position: absolute; right: 4px; top: 4px; background: rgba(255,255,255,.92); }
  .sl-card .num { position: absolute; left: 6px; top: 6px; background: rgba(255,255,255,.92); border-radius: 99px; padding: 0 7px; font-size: 11px; font-weight: 600; }

  /* Pestañas */
  #tabs { flex-basis: 100%; display: flex; gap: 4px; overflow-x: auto; margin: 0 -4px -12px; }
  #tabs button { border: 0; background: none; font: inherit; font-size: 13.5px; padding: 8px 12px 10px; cursor: pointer; color: var(--muted); border-bottom: 2px solid transparent; white-space: nowrap; }
  #tabs button:hover { color: var(--text); }
  #tabs button.on { color: var(--accent); border-bottom-color: var(--accent); font-weight: 600; }
  #tabs small { font-variant-numeric: tabular-nums; margin-left: 4px; }
  .layout.full { grid-template-columns: 1fr; }
  .layout.full aside { display: none; }
  .intro { color: var(--muted); font-size: 13px; margin: 2px 0 14px; }

  /* Artículos agrupados dentro de cada categoría */
  .art { margin: 0 0 18px; }
  .art h3 { font-size: 13.5px; margin: 0 0 8px; padding-top: 10px; border-top: 1px solid var(--line); display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .art h3 small { color: var(--muted); font-weight: 400; font-size: 12px; }

  /* Barra de herramientas de las vistas de inspección */
  .bar { display: flex; gap: 10px; flex-wrap: wrap; align-items: end; margin-bottom: 14px; }
  .bar label { display: flex; flex-direction: column; gap: 3px; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; }
  .bar select { width: auto; min-width: 180px; }

  /* Tabla de stock bajo */
  .tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 10px; }
  table.tbl { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tbl th { text-align: left; font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; padding: 8px 10px; background: var(--panel); position: sticky; top: 0; white-space: nowrap; }
  .tbl td { padding: 7px 10px; border-top: 1px solid var(--line); vertical-align: middle; }
  .tbl tr[data-i] { cursor: pointer; }
  .tbl tr[data-i]:hover td { background: var(--panel); }
  .tbl .n { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .tbl .mini { display: inline-block; width: 60px; height: 6px; background: var(--panel); border-radius: 3px; vertical-align: middle; margin-left: 6px; overflow: hidden; }
  .tbl .mini i { display: block; height: 100%; background: var(--accent); border-radius: 0 3px 3px 0; }
  .sw { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; box-shadow: inset 0 0 0 1px rgba(0,0,0,.18); }
  .sw.x { background: repeating-linear-gradient(45deg, #fff 0 2px, #d6d6dc 2px 4px); }

  /* Ventas del mes */
  .kpis.v { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); margin-bottom: 16px; }
  .rk { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 12px; margin-bottom: 22px; }
  .rk > div { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
  .rk h3 { font-size: 13px; margin: 0 0 8px; }
  .rk ol { margin: 0; padding: 0; list-style: none; counter-reset: r; }
  .rk li { counter-increment: r; display: grid; grid-template-columns: 18px 1fr auto; gap: 6px; align-items: baseline; padding: 4px 0; font-size: 13px; cursor: pointer; border-radius: 4px; }
  .rk li:hover { background: var(--panel); }
  .rk li::before { content: counter(r); color: var(--muted); font-size: 12px; text-align: right; }
  .rk li b { font-variant-numeric: tabular-nums; }
  .rk li em { font-style: normal; color: var(--muted); font-size: 12px; }
  .chart h3 { font-size: 14px; margin: 0 0 2px; }
  .chart .grp { padding: 10px 0 6px; border-top: 1px solid var(--line); }
  .chart .gh { display: flex; justify-content: space-between; gap: 10px; font-size: 13px; font-weight: 650; margin-bottom: 4px; }
  .chart .gh small { color: var(--muted); font-weight: 400; font-variant-numeric: tabular-nums; }
  .chart .row { display: grid; grid-template-columns: minmax(110px, 190px) 1fr 70px; gap: 10px; align-items: center; padding: 3px 0; cursor: pointer; border-radius: 4px; }
  .chart .row:hover { background: var(--panel); }
  .chart .lb { font-size: 12.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chart .tr { height: 14px; }
  .chart .tr i { display: block; height: 100%; min-width: 2px; background: var(--accent); border-radius: 0 4px 4px 0; }
  .chart .row:hover .tr i { background: #163ba3; }
  .chart .vl { font-size: 12.5px; text-align: right; font-variant-numeric: tabular-nums; color: var(--muted); }
  /* Chips (filtro de saldos, aptos, colores, "ideal para") */
  .chips { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .chip { border: 1px solid var(--line); background: var(--bg); border-radius: 99px; padding: 4px 10px; font: inherit; font-size: 12.5px; cursor: pointer; color: var(--text); white-space: nowrap; }
  .chip:hover { background: var(--panel); }
  .chip.on { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); font-weight: 600; }
  .chip small { color: var(--muted); font-variant-numeric: tabular-nums; margin-left: 3px; }
  .tag { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; padding: 2px 8px; border-radius: 99px; background: var(--panel); color: var(--text); white-space: nowrap; }
  .tag.off { opacity: .45; }
  .tag button { border: 0; background: none; padding: 0 0 0 2px; cursor: pointer; color: var(--muted); font-size: 13px; line-height: 1; }
  .tag button:hover { color: var(--buy); }
  .tags { display: flex; gap: 4px; flex-wrap: wrap; }

  /* Vistas con filtros propios (Técnica, Inspiración, Combinaciones) */
  .dos { display: grid; grid-template-columns: 230px 1fr; gap: 20px; align-items: start; }
  .facetas { position: sticky; top: calc(var(--hh, 100px) + 10px); max-height: calc(100vh - var(--hh, 100px) - 20px); overflow: auto; padding-right: 4px; }
  .facetas details { border-bottom: 1px solid var(--line); padding: 6px 0; }
  .facetas summary { font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; cursor: pointer; padding: 4px 0; list-style-position: inside; }
  .facetas summary b { color: var(--accent); }
  .facetas label { display: flex; gap: 6px; align-items: center; font-size: 12.5px; padding: 2px 0; cursor: pointer; }
  .facetas label span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .facetas label small { color: var(--muted); font-variant-numeric: tabular-nums; }
  .facetas label.cero { opacity: .4; }
  .facetas .fg { display: grid; grid-template-columns: 1fr auto; align-items: center; }
  .facetas .fg .fgv { grid-column: 1 / -1; padding-left: 20px; border-left: 2px solid var(--line); margin: 2px 0 4px 6px; }
  .facetas .abre { border: 0; background: none; color: var(--muted); font: inherit; font-size: 11px; cursor: pointer; padding: 2px 4px; border-radius: 4px; white-space: nowrap; }
  .facetas .abre:hover { background: var(--panel); color: var(--text); }
  .facetas .sw { margin-right: 0; flex: none; }
  /* Filtro de color dentro del panel izquierdo (Catálogo y Saldos) */
  #side .facetas { position: static; max-height: none; overflow: visible; padding: 0 2px 0 8px; margin-top: 12px; }
  #side .facetas details { border: 0; padding: 0; }
  #side .facetas summary { font-size: 11px; letter-spacing: .08em; margin: 6px 0 4px; }
  #side .facetas p { margin: 6px 0 0; }
  .grupo h2 { font-size: 15px; margin: 18px 0 10px; display: flex; gap: 10px; align-items: baseline; }
  .grupo:first-child h2 { margin-top: 0; }
  .grupo h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }

  /* Ficha técnica por artículo */
  .tec { display: grid; grid-template-columns: 96px 1fr; gap: 14px; border: 1px solid var(--line); border-radius: 10px; padding: 12px; margin-bottom: 10px; cursor: pointer; }
  .tec:hover { border-color: #c9c9d0; box-shadow: 0 4px 14px rgba(0,0,0,.06); }
  .tec .ph { border-radius: 8px; overflow: hidden; }
  .tec h3 { margin: 0 0 2px; font-size: 14.5px; display: flex; gap: 8px; align-items: baseline; flex-wrap: wrap; }
  .tec h3 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .tec dl { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 6px 14px; margin: 8px 0; }
  .tec dt { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
  .tec dd { margin: 0; font-size: 13px; }
  .tec .fila { display: flex; gap: 8px; align-items: baseline; margin-top: 6px; font-size: 12px; }
  .tec .fila > b { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; min-width: 64px; }
  .rot { font-size: 11px; font-weight: 700; padding: 2px 8px; border-radius: 99px; white-space: nowrap; }
  .rot-3 { color: var(--ok); background: var(--ok-bg); }
  .rot-2 { color: var(--less); background: var(--less-bg); }
  .rot-1 { color: var(--over); background: var(--over-bg); }
  .rot-0 { color: var(--none); background: var(--none-bg); }
  .est { font-size: 10.5px; color: var(--muted); font-style: italic; }

  /* Inspiración */
  .ins { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 14px; }
  .insp { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; }
  .insp .ph { aspect-ratio: 16 / 9; cursor: pointer; }
  .insp .bd { padding: 12px 14px 14px; display: flex; flex-direction: column; gap: 8px; }
  .insp h3 { margin: 0; font-size: 15px; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
  .insp h3 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  .insp .tx { font-size: 12.5px; color: var(--text); }
  .insp .lbl { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); font-weight: 600; margin-bottom: 3px; }
  .insp .add { display: flex; gap: 6px; margin-top: 6px; }
  .insp .add input { flex: 1; min-width: 0; border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; font: inherit; font-size: 12.5px; }
  .insp .add input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }

  /* Combinaciones y reemplazos */
  .lista { border: 1px solid var(--line); border-radius: 10px; overflow: auto; max-height: calc(100vh - var(--hh, 100px) - 40px); position: sticky; top: calc(var(--hh, 100px) + 10px); }
  .lista button { display: flex; gap: 8px; align-items: center; width: 100%; text-align: left; border: 0; border-bottom: 1px solid var(--line); background: var(--bg); padding: 7px 10px; font: inherit; font-size: 12.5px; cursor: pointer; }
  .lista button:hover { background: var(--panel); }
  .lista button.on { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
  .lista button small { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .sel { display: grid; grid-template-columns: 150px 1fr; gap: 16px; border: 1px solid var(--line); border-radius: 12px; padding: 14px; margin-bottom: 18px; }
  .sel .ph { border-radius: 8px; overflow: hidden; }
  .sel h2 { margin: 0 0 2px; font-size: 19px; }
  .sug h3 { font-size: 14px; margin: 20px 0 4px; }
  .sug .intro { margin-bottom: 8px; }
  .sug .grid { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
  .card .por { font-size: 10.5px; color: var(--accent); line-height: 1.3; margin-top: 3px; }
  @media (max-width: 860px) {
    .dos { grid-template-columns: 1fr; }
    .facetas, .lista { position: static; max-height: 260px; }
    .tec, .sel { grid-template-columns: 72px 1fr; }
  }

  /* Ventas del mes: gráfico vertical con todas las ventas */
  .vchart { border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 10px; margin-bottom: 18px; }
  .vchart h3 { font-size: 14px; margin: 0 0 2px; }
  .vplot { --alto: 230px; --lab: 52px; position: relative; padding-left: 44px; }
  .vg { position: absolute; left: 44px; right: 0; border-top: 1px dashed var(--line); pointer-events: none; }
  .vg span { position: absolute; left: -44px; top: -8px; width: 38px; text-align: right; font-size: 10.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .vbars { display: flex; align-items: stretch; border-bottom: 1px solid #c9c9d0; position: relative; overflow: hidden; }
  /* La cola de columnas finitas se reparte el espacio que dejan los destacados (pueden quedar de menos de 1 px) */
  .vb { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; cursor: pointer; }
  .vb.d { flex: 0 0 76px; margin: 0 2px; }
  .vb .va { height: var(--alto); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; }
  .vb .va i { display: block; width: 100%; min-height: 1px; background: #c9cdd6; border-radius: 3px 3px 0 0; }
  .vb.d .va i { background: var(--accent); }
  .vb:hover .va i { background: #8e95a3; }
  .vb.d:hover .va i { background: #163ba3; }
  .vb .vv { font-size: 11px; font-weight: 650; font-variant-numeric: tabular-nums; margin-bottom: 2px; }
  .vb .vl2 { height: var(--lab); padding-top: 4px; font-size: 10.5px; line-height: 1.2; text-align: center; overflow: hidden; color: var(--muted); }
  .vb .vl2 b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; color: var(--text); word-break: break-word; }
  .vb .vl2 .sw { width: 8px; height: 8px; margin-right: 3px; }
  .vb .vl2 .vc { display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 860px) { .vplot { --alto: 180px; overflow-x: auto; } .vbars { min-width: 1100px; } .vg { width: 1100px; right: auto; } }

  #tip { position: fixed; z-index: 30; pointer-events: none; background: var(--bg); border: 1px solid var(--line); box-shadow: 0 6px 20px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 12.5px; display: none; max-width: 260px; }
  #tip b { font-variant-numeric: tabular-nums; }
  #tip div { color: var(--muted); }

  /* Ficha */
  #ov { position: fixed; inset: 0; background: rgba(20,20,30,.35); z-index: 10; display: none; }
  #ov.open { display: block; }
  #det { position: fixed; top: 0; right: 0; bottom: 0; width: min(920px, 100vw); background: var(--bg); z-index: 11; overflow: auto; box-shadow: -10px 0 30px rgba(0,0,0,.12); transform: translateX(100%); transition: transform .2s; }
  #det.open { transform: none; }
  .dh { position: sticky; top: 0; background: var(--bg); border-bottom: 1px solid var(--line); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; gap: 10px; z-index: 1; }
  .dh .crumb { color: var(--muted); font-size: 12px; }
  .db { padding: 20px; display: grid; grid-template-columns: 340px 1fr; gap: 24px; }
  .big { aspect-ratio: 1; border-radius: 10px; overflow: hidden; background: var(--panel); position: relative; border: 1px solid var(--line); }
  .big img { width: 100%; height: 100%; object-fit: cover; }
  .note { font-size: 12px; color: var(--muted); margin-top: 6px; }
  .colors { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 14px; }
  .colors button { width: 52px; border: 1px solid var(--line); border-radius: 6px; padding: 0; background: var(--panel); cursor: pointer; overflow: hidden; text-align: center; font-size: 9px; color: var(--muted); }
  .colors button.on { outline: 2px solid var(--accent); }
  .colors img, .colors .sw { width: 100%; aspect-ratio: 1; object-fit: cover; display: block; }
  .colors .sw { display: grid; place-items: center; font-size: 10px; }
  .colors span { display: block; padding: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  h2.t { margin: 0 0 2px; font-size: 22px; }
  .sub { color: var(--muted); margin-bottom: 14px; }
  .kpis { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 10px; }
  .kpi { background: var(--panel); border-radius: 8px; padding: 8px 10px; }
  .kpi small { display: block; color: var(--muted); font-size: 11px; }
  .kpi b { font-size: 17px; font-variant-numeric: tabular-nums; }
  .ana { font-size: 13px; padding: 8px 10px; border-radius: 8px; border: 1px solid var(--line); margin-bottom: 18px; }
  .fld { margin-bottom: 14px; }
  .fld label { display: flex; justify-content: space-between; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); font-weight: 600; margin-bottom: 4px; }
  .fld textarea, .fld input { width: 100%; border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; font: inherit; font-size: 13.5px; resize: vertical; background: var(--bg); color: var(--text); }
  .fld textarea:focus, .fld input:focus { outline: 2px solid var(--accent-soft); border-color: var(--accent); }
  .web { background: var(--panel); border-radius: 8px; padding: 12px 14px; font-size: 13px; margin-bottom: 18px; }
  .web ul { margin: 6px 0 0; padding-left: 18px; }
  .web a { color: var(--accent); }
  .hint { font-size: 12px; color: var(--muted); }
  #toast { position: fixed; left: 50%; bottom: 20px; transform: translateX(-50%); background: #1b1b1f; color: #fff; padding: 8px 14px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .2s; z-index: 20; pointer-events: none; }
  #toast.show { opacity: 1; }
  #menuBtn { display: none; }
  @media (max-width: 860px) {
    .layout { grid-template-columns: 1fr; }
    aside { display: none; position: static; height: auto; border-right: 0; border-bottom: 1px solid var(--line); }
    aside.open { display: block; }
    #menuBtn { display: inline-block; }
    .db { grid-template-columns: 1fr; }
    header { padding: 10px 16px; }
    main { padding: 12px 16px 60px; }
    .grid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  }
</style>

<body>
<header>
  <h1>SAXS <span>· Enciclopedia de stock</span></h1>
  <button class="btn" id="menuBtn">Filtros</button>
  <input id="q" type="search" placeholder="Buscar artículo, color, SKU, uso, cliente…">
  <div class="stats" id="stats"></div>
  <button class="btn primary" id="save" title="Descarga enriquecimiento.js con todas las fichas editadas">Guardar fichas</button>
  <button class="btn" id="csv" title="Exporta lo que se ve en pantalla a CSV (abre en Excel)">Exportar CSV</button>
  <button class="btn sel-btn" id="selBtn" title="Ver y descargar los productos seleccionados">Selección <b id="selN">0</b></button>
  <nav id="tabs"></nav>
</header>
<div class="layout" id="layout">
  <aside id="side">
    <h3>Vista</h3>
    <div id="modos">
      <label class="chk"><input type="radio" name="modo" value="filas"> Fila por producto</label>
      <label class="chk"><input type="radio" name="modo" value="cards"> Artículos por color</label>
      <label class="chk"><input type="radio" name="modo" value="lista"> Listado</label>
      <label class="chk"><input type="radio" name="modo" value="detalle"> Detalle</label>
    </div>
    <div id="disp" class="sep">
      <label class="chk"><input type="radio" name="disp" value="todo"> Todos los productos</label>
      <label class="chk"><input type="radio" name="disp" value="stock"> Solo con stock</label>
      <label class="chk"><input type="radio" name="disp" value="stockped"> Solo con stock + pedidos hechos</label>
      <label class="chk"><input type="radio" name="disp" value="ped"> Solo pedidos hechos</label>
    </div>
    <label class="chk"><input type="checkbox" id="onlyEdited"> Solo fichas editadas</label>
    <h3>Graduar stock</h3>
    <div id="grad">
      <div class="gr-fila"><select id="gsobre" title="Qué cantidad se gradúa"><option value="stock">Stock</option><option value="total">Disponible c/pedidos</option></select></div>
      <div class="gr-fila"><label>Desde<input type="number" id="gmin" min="0" step="50" placeholder="0" inputmode="numeric"></label><label>Hasta<input type="number" id="gmax" min="0" step="50" placeholder="sin tope" inputmode="numeric"></label><span>m</span></div>
      <div class="chips gr-chips"></div>
    </div>
    <h3>Ordenar</h3>
    <select id="sort">
      <option value="nombre">Alfabético</option>
      <option value="precioDesc">De mayor a menor precio</option>
      <option value="precioAsc">De menor a mayor precio</option>
      <option value="stock">Mayor stock</option>
      <option value="stockAsc">Menor stock</option>
      <option value="total">Mayor disponible total</option>
      <option value="ventaMes">Mayor venta en el último mes</option>
      <option value="cob">Menor cobertura</option>
    </select>
    <h3>Señal de compra</h3>
    <div id="sigs"></div>
    <h3>Categoría (menú web)</h3>
    <div id="cats"></div>
    <div id="colores"></div>
  </aside>
  <main id="main"></main>
</div>
<div id="ov"></div>
<section id="det" aria-modal="true" role="dialog"></section>
<section id="selp" role="dialog" aria-label="Selección"></section>
<div id="toast"></div>
<div id="tip"></div>

<script src="datos.js"></script>
<script src="enriquecimiento.js"></script>
<script>
const ITEMS = window.SAXS_ITEMS, FAM = window.SAXS_FAMILIAS;
const LS = 'saxs-enriq-v1';
const CAMPOS = [
  ['tipo', 'Qué es', 1],
  ['tecnica', 'Cómo es técnicamente', 3],
  ['usos', 'Para qué se usa', 2],
  ['cliente', 'Tipo de cliente', 2],
  ['aplicacion', 'Productos donde se aplica', 2],
  ['notas', 'Notas comerciales / argumentos de venta', 3]
];
const fmt = n => (n || 0).toLocaleString('es-AR', { maximumFractionDigits: 0 });
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' })[c]);
const norm = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
const artKey = it => norm(it.art).replace(/\s+/g, ' ').trim();
const sigClass = s => 'p-' + (s || 'SIN').split(' ')[0];
const toast = m => { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove('show'), 2200); };

// Fichas: base del archivo enriquecimiento.js + cambios locales más recientes (por artículo, aplica a todos sus colores)
let ENR = Object.assign({}, window.SAXS_ENRIQ || {});
try {
  const loc = JSON.parse(localStorage.getItem(LS) || '{}');
  for (const k in loc) if (!ENR[k] || (loc[k].t || 0) > (ENR[k].t || 0)) ENR[k] = loc[k];
} catch (e) {}
const persist = () => { try { localStorage.setItem(LS, JSON.stringify(ENR)); } catch (e) {} };

function ficha(it) {
  const f = FAM[it.fam] || {}, e = ENR[artKey(it)] || {};
  const base = {
    tipo: f.familia || '',
    tecnica: [f.tecnica, it.web && it.web.detalles.length ? 'Según la web: ' + it.web.detalles.join(' · ') + '.' : ''].filter(Boolean).join('\n'),
    usos: f.usos || '', cliente: f.cliente || '', aplicacion: f.aplicacion || '', notas: ''
  };
  const out = {};
  for (const [k] of CAMPOS) out[k] = e[k] ?? base[k];
  out._editado = !!e.t;
  return out;
}

// Estado
const MESES = window.SAXS_MESES || [];
const SALDO = 200, BAJO = 800;
const st = { q: '', cats: {}, sig: '', modo: 'cards', disp: 'stock', gsobre: 'stock', gmin: null, gmax: null, onlyEdited: false, sort: 'nombre', vista: 'cat', tipo: '', color: '', mes: MESES.length - 1, vcat: '', tecF: {}, tecG: 'tex', insF: {}, combo: '' };
try { Object.assign(st, JSON.parse(localStorage.getItem('saxs-vista') || '{}'), { q: '' }); } catch (e) {}
delete st.saldoTipos; delete st.bajoF;
// Catálogo, Saldos y Stock bajo comparten el panel izquierdo, pero cada pestaña guarda su propia selección.
// Los campos del panel viven en st mientras la pestaña está activa y se guardan en st.panel[pestaña] al salir.
const PANEL = ['cats', 'sig', 'modo', 'disp', 'gsobre', 'gmin', 'gmax', 'onlyEdited', 'sort', 'catF', 'lcol'];
const PESTANAS_PANEL = ['cat', 'saldos', 'bajo'];
let panelActivo = null;
const guardaPanel = () => { if (panelActivo) st.panel[panelActivo] = Object.fromEntries(PANEL.map(k => [k, st[k]])); };
const saveView = () => { guardaPanel(); try { localStorage.setItem('saxs-vista', JSON.stringify(st)); } catch (e) {} };

// Categorías = menú principal de saxs.com.ar, en su orden
const CATS = (window.SAXS_MENU || []).filter(c => ITEMS.some(i => i.menu === c));
const SIGS = ['COMPRAR', 'PEDIR MENOS', 'OK', 'SOBRESTOCK', 'SIN VENTAS'];
const TIPOS = [...new Set(ITEMS.map(i => i.cat))].sort((a, b) => a.localeCompare(b, 'es'));
// Color base: primera palabra del color sin aclaraciones (SUELA OSCURO D/T → SUELA)
// Se saltean palabras que nombran el diseño y no el color (TELA DE CAMBRE NEGRO → NEGRO, HELIOS PLATA → PLATA)
const NO_COLOR = new Set(['TELA', 'DE', 'CAMBRE', 'NILO', 'HELIOS', 'KRONOS', 'LASER', 'LIGERA', 'CAJA', 'UNIDADES']);
const ALIAS_COLOR = { NEGRA: 'NEGRO', FUCCIA: 'FUCIA', ROSE: 'ROSE GOLD', TURQUESA: 'TURQUEZA', MOCA: 'MOCCA' };
const colorBase = it => {
  const w = norm(it.color).toUpperCase().replace(/\(.*?\)|\bD\/T\b|\bDT\b|\bBK\b|\bNUEVO COLOR\b|\d+/g, ' ').replace(/[^A-Z ]/g, ' ').trim().split(/\s+/).filter(x => x && !NO_COLOR.has(x));
  return ALIAS_COLOR[w[0]] || w[0] || 'SIN COLOR';
};
const COLORES = [...new Set(ITEMS.map(colorBase))].sort((a, b) => a.localeCompare(b, 'es'));
// Familias de color para filtrar por grupo (marrones, grises, rojos…). Lo que no está listado cae en "Otros".
const FAM_COLOR = [
  ['Negros', '#1b1b1b', ['NEGRO']],
  ['Blancos y crudos', '#f4f1ea', ['BLANCO', 'HUESO', 'MANTECA', 'NATURAL', 'TIZA', 'CRUDO']],
  ['Beiges y nudes', '#d9bf9f', ['BEIGE', 'NUDE', 'ALMENDRA', 'ARENA', 'CORCHO']],
  ['Marrones', '#7a4a2a', ['CHOCOLATE', 'MARRON', 'SUELA', 'CAMEL', 'CARAMELO', 'HABANO', 'MIEL', 'MOCCA', 'TOPO', 'VISON', 'MADERA', 'COGNAC']],
  ['Grises', '#8e8e93', ['GRIS', 'PLOMO']],
  ['Rojos y bordós', '#b3261e', ['ROJO', 'BORDO', 'TOMATE']],
  ['Rosas y fucsias', '#e05a9a', ['ROSA', 'FUCIA', 'CHICLE']],
  ['Naranjas y terracotas', '#e0702a', ['NARANJA', 'CORAL', 'TERRA']],
  ['Amarillos', '#f2c94c', ['AMARILLO', 'MAIZ', 'OCRE', 'MOSTAZA']],
  ['Verdes', '#2e7d32', ['VERDE', 'OLIVA', 'MANZANA', 'LIMA', 'MILITAR']],
  ['Azules y celestes', '#1f4fa0', ['AZUL', 'CELESTE', 'TURQUEZA', 'JEAN', 'MARINO']],
  ['Violetas y lilas', '#8e6bbf', ['LILA', 'LAVANDA', 'VIOLETA', 'UVA']],
  ['Metalizados', '#b8b8bd', ['PLATA', 'ORO', 'PELTRE', 'PLATINO', 'ROSE GOLD', 'TORNASOL', 'PERLA', 'DORADO', 'COBRE', 'BRONCE']],
  ['Animal print y estampados', '#a0612b', ['LEOPARDO', 'CROCO', 'CHITA', 'JAGUAR', 'VACA', 'PRINT', 'MULTI']],
  ['Flúor y neón', '#c6ff00', ['FLUO', 'NEON']]
];
const FAM_DE_COLOR = Object.fromEntries(FAM_COLOR.flatMap(([f, , cs]) => cs.map(c => [c, f])));
const famColor = c => FAM_DE_COLOR[c] || 'Otros';
const ORDEN_FAM = [...FAM_COLOR.map(f => f[0]), 'Otros'];
const swFam = f => (FAM_COLOR.find(x => x[0] === f) || [])[1];
const esSaldo = it => it.stock > 0 && it.stock < SALDO;
// Una vista guardada puede apuntar a valores que ya no existen tras regenerar datos.js: sin botón para quitarlos, la lista queda vacía
if (!CATS.includes(st.vcat)) st.vcat = '';
// Categorías elegidas: { CATEGORÍA: [] } = toda la categoría; { CATEGORÍA: ['Sub', …] } = solo esas subcategorías
const SUBS = window.SAXS_SUBS || {};
const coloresDeFamilias = fs => COLORES.filter(c => fs.includes(famColor(c)));
// Panel de cada pestaña: lo guardado (validado) y, al abrir la página, siempre "Artículos por color" y "Solo con stock";
// Stock bajo arranca además con negros, marrones y blancos
function validaPanel(p, v) {
  p = Object.assign({ cats: {}, sig: '', modo: 'cards', disp: 'stock', gsobre: 'stock', gmin: null, gmax: null, onlyEdited: false, sort: 'nombre', catF: {}, lcol: null }, p || {});
  delete p.onlyStock;
  if (!['stock', 'total'].includes(p.gsobre)) p.gsobre = 'stock';
  for (const k of ['gmin', 'gmax']) if (!(typeof p[k] === 'number' && p[k] >= 0)) p[k] = null;
  if (!p.cats || typeof p.cats !== 'object' || Array.isArray(p.cats)) p.cats = {};
  for (const c in p.cats) { if (!CATS.includes(c)) delete p.cats[c]; else p.cats[c] = (p.cats[c] || []).filter(s => (SUBS[c] || []).concat('Otros').includes(s)); }
  if (!SIGS.includes(p.sig)) p.sig = '';
  if (!['nombre', 'precioDesc', 'precioAsc', 'stock', 'stockAsc', 'total', 'ventaMes', 'cob'].includes(p.sort)) p.sort = 'nombre';
  // Orden con el que abre cada pestaña: Saldos por mayor stock, Stock bajo por mayor venta del último mes (el Catálogo recuerda el último)
  if (v === 'saldos') { p.sort = 'stock'; p.lcol = null; }
  if (v === 'bajo') { p.sort = 'ventaMes'; p.lcol = null; }
  if (!p.catF || typeof p.catF !== 'object' || Array.isArray(p.catF)) p.catF = {};
  p.modo = 'cards'; p.disp = 'stock';
  if (v === 'bajo') p.catF = Object.assign({}, p.catF, { color: coloresDeFamilias(['Negros', 'Marrones', 'Blancos y crudos']) });
  return p;
}
// Lo guardado antes de tener paneles por pestaña (campos sueltos en st) pasa a ser el del Catálogo
const viejo = Object.fromEntries(PANEL.filter(k => k in st).map(k => [k, st[k]]));
st.panel = Object.fromEntries(PESTANAS_PANEL.map(v => [v, validaPanel((st.panel || {})[v] || (v === 'cat' ? viejo : null), v)]));
delete st.cat; delete st.fam; delete st.group;
function usaPanel(v) {
  if (!PESTANAS_PANEL.includes(v) || v === panelActivo) return;
  guardaPanel();
  Object.assign(st, st.panel[v]);
  panelActivo = v;
}
usaPanel(PESTANAS_PANEL.includes(st.vista) ? st.vista : 'cat');
const abiertosCat = new Set(Object.keys(st.cats));
if (!TIPOS.includes(st.tipo)) st.tipo = '';
delete st.color; delete st.tipo;
if (!['cat', 'saldos', 'bajo', 'ventas', 'tecnica', 'inspira', 'combo'].includes(st.vista)) st.vista = 'cat';
for (const k of ['tecF', 'insF', 'catF']) if (!st[k] || typeof st[k] !== 'object' || Array.isArray(st[k])) st[k] = {};
if (!ITEMS.some(i => i.sku === st.combo)) st.combo = '';

// --- Artículos (agrupan sus colores): base de las vistas Técnica, Inspiración y Combinaciones ---
const TEX = window.SAXS_TEXTURAS || {};
const ULT = MESES.length - 1;
const ARTS = (() => {
  const g = {};
  ITEMS.forEach(i => (g[artKey(i)] = g[artKey(i)] || []).push(i));
  return Object.entries(g).map(([key, items]) => ({
    key, items, art: items[0].art, tec: items[0].tec || {}, menu: items[0].menu, cat: items[0].cat, fam: items[0].fam,
    foto: items.find(i => i.imgTipo !== 'sin' && i.stock > 0) || items.find(i => i.imgTipo !== 'sin') || items[0],

// Ventas del mes: barras por artículo y color + 5 más y 5 menos vendidos
// Gráfico vertical con todas las ventas del mes (una columna por artículo + color, de mayor a menor).
// Destacados: los que venden muy por encima del resto (más de promedio + 2 desvíos estándar), con nombre a la vista.
function graficoTodas(vend, v, prom, mes) {
  if (!vend.length) return '';
  const xs = vend.map(v), media = xs.reduce((a, b) => a + b, 0) / xs.length;
  const umbral = media + 2 * Math.sqrt(xs.reduce((a, b) => a + (b - media) ** 2, 0) / xs.length);
  let dest = vend.filter(i => v(i) > umbral).slice(0, 15);
  if (dest.length < 3) dest = vend.slice(0, Math.min(3, vend.length));
  const esDest = new Set(dest), max = v(vend[0]);
  const totArt = {}; vend.forEach(i => totArt[artKey(i)] = (totArt[artKey(i)] || 0) + v(i));
  const tope = Math.ceil(max / Math.pow(10, Math.floor(Math.log10(max)))) * Math.pow(10, Math.floor(Math.log10(max)));
  const lineas = [0.25, 0.5, 0.75, 1].map(f => `<div class="vg" style="bottom:calc(var(--lab) + var(--alto) * ${f})"><span>${fmt(tope * f)}</span></div>`).join('');
  const parte = dest.reduce((a, i) => a + v(i), 0), total = vend.reduce((a, i) => a + v(i), 0);
  return `<div class="vchart"><h3>Todas las ventas de ${esc(mes)} · ${fmt(vend.length)} artículos por color</h3>
    <p class="intro">Cada columna es un artículo en un color, de mayor a menor. En azul, los ${dest.length} que venden muy por encima del resto (más de ${fmt(umbral)} m en el mes): juntos suman ${fmt(parte)} m, el ${Math.round(parte / total * 100)} % de lo vendido. Pasá el mouse por cualquier columna para ver el detalle.</p>
    <div class="vplot">${lineas}<div class="vbars">${vend.map(i => {
      const d = esDest.has(i), h = v(i) / tope * 100;
      return `<div class="vb ${d ? 'd' : ''}" data-i="${ITEMS.indexOf(i)}" data-tip="${esc(JSON.stringify([i.art, i.color || '—', v(i), Math.round(v(i) / totArt[artKey(i)] * 100), Math.round(prom(i)), i.stock]))}">
        <div class="va">${d ? `<span class="vv">${fmt(v(i))}</span>` : ''}<i style="height:${h}%"></i></div>
        <div class="vl2">${d ? `<b>${esc(i.art)}</b><span class="vc">${swatch(i.color)}${esc(i.color || '—')}</span>` : ''}</div></div>`;
    }).join('')}</div></div></div>`;
}

// --- Combinaciones y reemplazos ---
function sugerencias(sel) {
  const a0 = ART[artKey(sel)], c0 = colorBase(sel), t0 = sel.tec || {};
  const otros = ITEMS.filter(i => i.stock > 0 && artKey(i) !== a0.key);
  const comunes = i => (i.tec.aptos || []).filter(x => (t0.aptos || []).includes(x)).length;
  const mejorPorArt = (lista, score) => {
    const m = {};
    lista.forEach(i => { const s = score(i), k = artKey(i); if (!m[k] || s > m[k].s || (s === m[k].s && i.stock > m[k].i.stock)) m[k] = { i, s }; });
    return Object.values(m).sort((x, y) => y.s - x.s || y.i.stock - x.i.stock).slice(0, 12);
  };
  const espCerca = i => t0.espMm != null && i.tec.espMm != null ? Math.max(0, 2 - Math.abs(i.tec.espMm - t0.espMm) * 5) : 0;
  return {
    colores: a0.items.filter(i => i !== sel && i.stock > 0).sort((x, y) => y.stock - x.stock).map(i => ({ i, por: [] })),
    porColor: mejorPorArt(otros.filter(i => colorBase(i) === c0), i => comunes(i) + (i.menu === sel.menu ? 1 : 0) + espCerca(i) / 2)
      .map(({ i }) => ({ i, por: [lindoV(i.tec.textura || ''), comunes(i) ? `${comunes(i)} aptos en común` : ''] })),
    porTextura: mejorPorArt(otros.filter(i => t0.textura && i.tec.textura === t0.textura), i => (colorBase(i) === c0 ? 3 : 0) + espCerca(i) + comunes(i) / 2)

    reemplazos: mejorPorArt(otros, i => (t0.textura && i.tec.textura === t0.textura ? 3 : 0) + (i.fam === sel.fam ? 2 : 0) + comunes(i) + espCerca(i) + (colorBase(i) === c0 ? 2 : 0) + (i.menu === sel.menu ? 1 : 0))

  document.getElementById('selBtn').classList.toggle('con', SEL.length > 0);
}
const botonFicha = it => `<button class="btn ${SEL_SET.has(it.sku) ? 'primary' : ''}" id="selfi" data-selfi="${esc(it.sku)}">${SEL_SET.has(it.sku) ? '✓ Seleccionado' : 'Seleccionar'}</button>`;

// Panel Selección: vistas Lista / Tarjetas / Tabla, orden y descarga
function renderSel() {
  const its = seleccionados(), p = document.getElementById('selp');
  const mini = i => i.imgTipo !== 'sin' ? `<img loading="lazy" src="${esc(encodeURI(i.img))}" alt="">` : '<div class="mini-img"></div>';
  const tot = its.reduce((a, i) => a + i.stock, 0);
  let cuerpo;
  if (!its.length) cuerpo = '<div class="empty">Todavía no elegiste productos.<br>Marcá la casilla de arriba a la izquierda de cada tarjeta (o de cada fila en el Listado).</div>';
  else if (st.selVista === 'tarjetas') cuerpo = `<div class="sl-grid">${its.map((i, k) => `<div class="sl-card"><span class="num">${k + 1}</span><button class="quita" data-quitasel="${esc(i.sku)}" title="Quitar de la selección">×</button>
      <div class="ph" data-abresel="${ITEMS.indexOf(i)}">${foto(i)}</div><div class="bd"><b>${esc(i.art)}</b><small>${esc(i.color || '—')}</small><small>${fmt(i.stock)} m · ${precioTxt(i)}</small></div></div>`).join('')}</div>`;
  else if (st.selVista === 'tabla') cuerpo = `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>#</th><th>Artículo</th><th>Color</th><th>SKU</th><th>Categoría</th><th class="n">Precio</th><th class="n">Stock</th><th class="n">Pedidos</th><th class="n">Venta ${esc(MESES[ULT] || '')}</th><th>Señal</th><th></th></tr></thead><tbody>
      ${its.map((i, k) => `<tr><td class="n">${k + 1}</td><td><b data-abresel="${ITEMS.indexOf(i)}" style="cursor:pointer">${esc(i.art)}</b></td><td>${swatch(i.color)}${esc(i.color || '—')}</td><td style="font-family:ui-monospace,Consolas,monospace;font-size:12px">${esc(i.sku)}</td><td>${esc(lindoV(i.menu))}</td>
        <td class="n">${precioTxt(i)}</td><td class="n">${fmt(i.stock)} m</td><td class="n">${fmt(pedidosHechos(i))} m</td><td class="n">${fmt(ventaMes(i))} m</td><td>${i.senal ? `<span class="pill ${sigClass(i.senal)}">${esc(i.senal)}</span>` : ''}</td>
        <td><button class="quita" data-quitasel="${esc(i.sku)}" title="Quitar">×</button></td></tr>`).join('')}</tbody></table></div>`;
  else cuerpo = its.map((i, k) => `<div class="sl-row"><span class="n">${k + 1}</span>${mini(i)}<div class="t" data-abresel="${ITEMS.indexOf(i)}"><b>${esc(i.art)}</b> · ${esc(i.color || '—')}<small>${esc(i.sku)} · ${esc(lindoV(i.menu))}${(i.sub || []).length ? ' › ' + esc(i.sub.join(', ')) : ''}</small></div>
      <div class="v">${precioTxt(i)}<small>precio web</small></div><div class="v">${fmt(i.stock)} m<small>${pedidosHechos(i) ? '+ ' + fmt(pedidosHechos(i)) + ' m pedidos' : 'stock'}</small></div>
      <button class="quita" data-quitasel="${esc(i.sku)}" title="Quitar de la selección">×</button></div>`).join('');
  p.innerHTML = `<div class="sh">
      <h2>Selección <small>${fmt(its.length)} producto${its.length === 1 ? '' : 's'} · ${fmt(tot)} m en stock</small><button class="btn" data-cierrasel>Cerrar ✕</button></h2>
      <div class="bar" style="margin:0">
        <label>Vista<select data-selvista>${[['lista', 'Lista'], ['tarjetas', 'Tarjetas'], ['tabla', 'Tabla']].map(([v, t]) => `<option value="${v}" ${st.selVista === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
        <label>Ordenar<select data-selorden>${ORDEN_SEL.map(([v, t]) => `<option value="${v}" ${st.selOrden === v ? 'selected' : ''}>${t}</option>`).join('')}</select></label>
      </div>
      <div class="acciones"><button class="btn" data-vaciasel ${its.length ? '' : 'disabled'}>Vaciar selección</button><button class="btn primary" data-bajasel ${its.length ? '' : 'disabled'}>Descargar Excel</button></div>
    </div><div class="sb">${cuerpo}</div>`;
}
function abreSel() { renderSel(); document.getElementById('selp').classList.add('open'); document.getElementById('ov').classList.add('open'); }
function cierraSel() { document.getElementById('selp').classList.remove('open'); if (!actual) document.getElementById('ov').classList.remove('open'); }

// Excel (.xlsx) armado acá mismo: un libro con una hoja, encabezado fijo, filtros y formatos de número
const COLS_XLS = [
  ['N°', (i, k) => k + 1, 'n', 5], ['SKU', i => i.sku, 's', 14], ['Artículo', i => i.art, 's', 26], ['Color', i => i.color, 's', 20],
  ['Categoría web', i => lindoV(i.menu), 's', 18], ['Subcategoría', i => (i.sub || []).join(', '), 's', 18], ['Tipo (Excel)', i => i.cat, 's', 18],
  ['Textura', i => lindoV((i.tec || {}).textura || ''), 's', 16], ['Precio web', precio, '$', 12], ['Stock (m)', i => i.stock, 'n', 11],
  ['En tránsito (m)', i => i.transito, 'n', 13], ['Pedidos sin facturar (m)', i => i.pedidos, 'n', 13], ['Stock + pedidos (m)', i => i.stock + pedidosHechos(i), 'n', 14],
  ['Disponible total (m)', i => i.total, 'n', 14], [`Venta ${MESES[ULT] || 'último mes'} (m)`, ventaMes, 'n', 14], ['Venta prom./mes (m)', i => i.venta, 'n', 13],
  ['Cobertura (meses)', i => i.cobertura, 'd', 11], ['Señal de compra', i => i.senal, 's', 16], ['Análisis de compra', i => i.analisis, 's', 40],
  ['Ancho', i => (i.tec || {}).ancho, 's', 10], ['Espesor', i => (i.tec || {}).espesor, 's', 10], ['Aptos', i => ((i.tec || {}).aptos || []).map(aptoTxt).join(', '), 's', 30],
  ['Página web', i => i.web ? i.web.url : '', 's', 40]
];
function xlsx(nombreHoja, filas, anchos, tipos) {
  const xe = s => String(s ?? '').replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g, '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  const col = n => { let s = ''; for (n++; n; n = Math.floor((n - 1) / 26)) s = String.fromCharCode(65 + (n - 1) % 26) + s; return s; };
  const estilo = { n: 2, $: 3, d: 4 };
  const filasXml = filas.map((f, r) => `<row r="${r + 1}">${f.map((v, c) => {
    const ref = col(c) + (r + 1);
    if (r === 0) return `<c r="${ref}" t="inlineStr" s="1"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
    if (v == null || v === '') return '';
    if (typeof v === 'number' && isFinite(v)) return `<c r="${ref}" s="${estilo[tipos[c]] || 0}"><v>${v}</v></c>`;
    return `<c r="${ref}" t="inlineStr"><is><t xml:space="preserve">${xe(v)}</t></is></c>`;
  }).join('')}</row>`).join('');
  const ult = col(filas[0].length - 1) + filas.length;
  const archivos = {
    '[Content_Types].xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
    '_rels/.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
    'xl/workbook.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="${xe(nombreHoja)}" sheetId="1" r:id="rId1"/></sheets><definedNames><definedName name="_xlnm._FilterDatabase" localSheetId="0" hidden="1">'${xe(nombreHoja)}'!$A$1:$${col(filas[0].length - 1)}$${filas.length}</definedName></definedNames></workbook>`,
    'xl/_rels/workbook.xml.rels': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
    'xl/styles.xml': '<?xml version="1.0" encoding="UTF-8" standalone="yes"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><numFmts count="2"><numFmt numFmtId="164" formatCode="&quot;$&quot;#,##0"/><numFmt numFmtId="165" formatCode="0.0"/></numFmts><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FFEAF0FF"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border><left/><right/><top/><bottom/><diagonal/></border></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="5"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0"/><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1"/><xf numFmtId="3" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="164" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/><xf numFmtId="165" fontId="0" fillId="0" borderId="0" xfId="0" applyNumberFormat="1"/></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
    'xl/worksheets/sheet1.xml': `<?xml version="1.0" encoding="UTF-8" standalone="yes"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>${anchos.map((w, c) => `<col min="${c + 1}" max="${c + 1}" width="${w}" customWidth="1"/>`).join('')}</cols><sheetData>${filasXml}</sheetData><autoFilter ref="A1:${ult}"/></worksheet>`
  };
  return zip(archivos);
}
// ZIP sin compresión (lo que necesita un .xlsx)
function zip(archivos) {
  const enc = new TextEncoder(), crcT = new Uint32Array(256);
  for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; crcT[n] = c >>> 0; }
  const crc = b => { let c = 0xFFFFFFFF; for (let i = 0; i < b.length; i++) c = crcT[(c ^ b[i]) & 0xFF] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  const d = new Date(), hora = (d.getHours() << 11) | (d.getMinutes() << 5) | (d.getSeconds() >> 1), dia = ((d.getFullYear() - 1980) << 9) | ((d.getMonth() + 1) << 5) | d.getDate();
  const partes = [], central = []; let off = 0;
  for (const [nombre, texto] of Object.entries(archivos)) {
    const n = enc.encode(nombre), datos = enc.encode(texto), c = crc(datos);
    const h = new DataView(new ArrayBuffer(30));
    [[0, 0x04034b50, 4], [4, 20, 2], [6, 0x0800, 2], [8, 0, 2], [10, hora, 2], [12, dia, 2], [14, c, 4], [18, datos.length, 4], [22, datos.length, 4], [26, n.length, 2], [28, 0, 2]].forEach(([p, v, t]) => t === 4 ? h.setUint32(p, v, true) : h.setUint16(p, v, true));
    const cd = new DataView(new ArrayBuffer(46));
    [[0, 0x02014b50, 4], [4, 20, 2], [6, 20, 2], [8, 0x0800, 2], [10, 0, 2], [12, hora, 2], [14, dia, 2], [16, c, 4], [20, datos.length, 4], [24, datos.length, 4], [28, n.length, 2], [30, 0, 2], [32, 0, 2], [34, 0, 2], [36, 0, 2], [38, 0, 4], [42, off, 4]].forEach(([p, v, t]) => t === 4 ? cd.setUint32(p, v, true) : cd.setUint16(p, v, true));
    partes.push(new Uint8Array(h.buffer), n, datos); central.push(new Uint8Array(cd.buffer), n);
    off += 30 + n.length + datos.length;
  }
  const tam = central.reduce((a, b) => a + b.length, 0), fin = new DataView(new ArrayBuffer(22)), cant = Object.keys(archivos).length;
  [[0, 0x06054b50, 4], [4, 0, 2], [6, 0, 2], [8, cant, 2], [10, cant, 2], [12, tam, 4], [16, off, 4], [20, 0, 2]].forEach(([p, v, t]) => t === 4 ? fin.setUint32(p, v, true) : fin.setUint16(p, v, true));
  return new Blob([...partes, ...central, new Uint8Array(fin.buffer)], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
}
function descargaSel() {
  const its = seleccionados(); if (!its.length) return;
  const filas = [COLS_XLS.map(c => c[0]), ...its.map((i, k) => COLS_XLS.map(c => { const v = c[1](i, k); return v == null ? '' : v; }))];
  const blob = xlsx('Selección', filas, COLS_XLS.map(c => c[3]), COLS_XLS.map(c => c[2]));
  const a = Object.assign(document.createElement('a'), { href: URL.createObjectURL(blob), download: `SAXS selección ${new Date().toLocaleDateString('sv')}.xlsx` });
  document.body.append(a); a.click(); a.remove();
  toast(`${its.length} productos descargados en Excel`);
}

// Eventos de la selección (casillas en cualquier parte de la página y botones del panel)
document.addEventListener('change', e => {
  const t = e.target;
  if (t.dataset.sel) elegir([t.dataset.sel], t.checked);
  else if (t.dataset.selall) elegir(t.dataset.selall.split('|'), t.checked);
  else if (t.dataset.selvista != null) { st.selVista = t.value; saveView(); renderSel(); }
  else if (t.dataset.selorden != null) { st.selOrden = t.value; saveView(); renderSel(); }
});
document.getElementById('selBtn').onclick = abreSel;
document.getElementById('selp').addEventListener('click', e => {
  const q = e.target.closest('[data-quitasel]'); if (q) return elegir([q.dataset.quitasel], false);
  if (e.target.closest('[data-cierrasel]')) return cierraSel();
  if (e.target.closest('[data-vaciasel]')) { if (confirm(`¿Sacar los ${SEL.length} productos de la selección?`)) elegir([...SEL], false); return; }
  if (e.target.closest('[data-bajasel]')) return descargaSel();
  const ab = e.target.closest('[data-abresel]'); if (ab) { cierraSel(); abrir(ITEMS[+ab.dataset.abresel]); }
});
document.getElementById('ov').addEventListener('click', cierraSel);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.getElementById('selp').classList.contains('open')) cierraSel(); });
pintaSelBtn();

render();
</script>
